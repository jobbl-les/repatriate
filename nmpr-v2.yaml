                value:
                  identifier: '100000010000023'
                  agentId: Insert Personal Access Token
                  reasonCode: intelligence
              Device Intel + Number Intel Search:
                summary: Device Intel + Number Intel Search using NMPR PAT
                value:
                  identifier: '447770000000'
                  agentId: Insert Personal Access Token
                  reasonCode: intelligence
                  updateMobileNetworkStatus: true
                  includeRelatedEvents: true
              Number Intel Search:
