openapi: 3.0.1
info:
  title: NMPR
  description: "**This API version is currently in BETA and may received updates before it is officially released.**\n\nThe NMPR API is availble globally to law enforcement agencies with a valid license. It can be used to\nquery Recipero's Device Intel and Number Intel services for the prevention and detection of crime.\n"
  version: v2
servers:
  - url: https://api.recipero.com/nmpr/v2
paths:
