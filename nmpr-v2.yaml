components:
  schemas:
    NMPR_Search_Response:
      type: object
      properties:
        summary:
          type: object
          properties:
            asset:
              type: boolean
              description: A device with the searched identifier is protected by Recipero AssetWatch.
            blocked:
              type: boolean
              description: A mobile network block exists for a device matching the searched identifier.
            crime:
              type: boolean
              description: A crime report exists for a device matching the searched identifier.
            found:
              type: boolean
              description: A found report exists for a device matching the searched identifier.
            information:
              type: boolean
              description: An information report exists for a device matching the searched identifier.
            insurance:
              type: boolean
              description: An insurance claim exists for a device matching the searched identifier.
            lost:
              type: boolean
              description: A loss report exists for a device matching the searched identifier.
            registered:
              type: boolean
              description: An ownership record exists for a device matching the searched identifier.
            makeModel:
              type: string
              description: The Make/Model associated with the identifier from ModelCheck.
            searchHistory:
              type: array
              items:
                enum:
                  - recipero-checkmend
                  - recipero-claimscheck
                  - recipero-intelligence
                  - recipero-nmpr
                type: string
              description: 'If there are previous searches for this serial number on Recipero systems, that system will be returned in the array. An empty array indicates the identifier has not been searched on Recipero systems.'
            validImei:
              type: boolean
              description: If an IMEI is submitted and the TAC is valid then this value will be true.
          additionalProperties: false
        correlationId:
          type: string
          description: A correlation ID for the search. This can be used when contacting support about a specific search.
        events:
          type: array
          items:
            required:
              - type
              - date
              - identifierMatched
            type: object
            properties:
              account:
                type: object
                properties:
                  address:
                    type: string
                    description: The address associated with the account.
                  email:
                    type: string
                    description: The email address associated with the account.
                  name:
                    type: string
                    description: The name associated with the account.
                  phone:
                    type: array
                    items:
                      type: object
                      properties:
                        number:
                          type: string
                          description: The phone number.
                        type:
                          enum:
                            - general
                            - landline
                            - mobile
                            - work
                          type: string
                          description: 'The type of phone number. E.g. work, mobile, landline or general.'
                      additionalProperties: false
                    description: The phone numbers associated with the account.
                  postcode:
                    type: string
                    description: The postcode/zipcode associated with the account.
                additionalProperties: false
                description: An account is usually returned when an Immobilise account it matched during a phone number search.
              organisation:
                type: object
                properties:
                  address:
                    type: string
                    description: The address associated with the organisation.
                  contactEmail:
                    type: string
                    description: The contact email address associated with the organisation.
                  contactNumber:
                    type: string
                    description: The contact phone number associated with the organisation.
                  id:
                    type: string
                    description: The ID of the organisation.
                  idFormat:
                    enum:
                      - uuid
                      - ori
                    type: string
                    description: The organisation ID format. The possible values are `uuid` and `ori`. `uuid` is a standard UUID format and represents a Recipero specific ID for the agency. `ori` is an identifier used by US law enforcement agencies.
                  name:
                    type: string
                    description: The name of the organisation.
                  postcode:
                    type: string
                    description: The postcode/zipcode associated with the organisation.
                  subUnit:
                    type: object
                    properties:
                      id:
                        type: string
                        description: The ID of the sub unit.
                      name:
                        type: string
                        description: The name of the sub unit.
                    additionalProperties: false
                    description: The sub unit that performed the search.
                additionalProperties: false
                description: An organisation is returned when previous search or check history matches the searched identifier.
              user:
                type: object
                properties:
                  email:
                    type: string
                    description: The email address of the user.
                  id:
                    type: string
                    description: The ID of the user.
                  name:
                    type: string
                    description: The name of the user.
                additionalProperties: false
                description: A user is returned when previous search or check history matches the searched identifier.
              certificateId:
                type: string
                description: 'If the record is a StatusCheck check, the associated certificate ID will be returned in this property.'
              country:
                type: string
                description: If the history event can be associated with a given Country it will be indicated in this property.
              date:
                type: string
                description: The the date of the history event. Recipero systems may have become aware of this record later than this date. The `dateAdded` property can provides the date the record was added to the system.
              dateAdded:
                type: string
                description: The the date the record was added to Recipero systems.
              deviceInfo:
                type: object
                properties:
                  description:
                    type: string
                    description: A description of the device.
                  identifierType:
                    type: string
                    description: The type of identifier registered against the history item.
                  makeModel:
                    type: string
                    description: The make/model of the device.
                  vendorProductId:
                    type: string
                    description: If the history event is from a retailer and the product ID has been supplied it will be included in this property.
                additionalProperties: false
                description: If the history event provides additional information about the device it will be included in this property.
              expires:
                type: string
                description: Some history events expire. After the record expires it will no longer impact checks on systems such as CheckMEND.
              identifierMatched:
                type: string
                description: The full identifier from the history event that matched the searched identifier.
              identifiers:
                type: array
                items:
                  type: string
                description: A list of identifiers associated with the history event.
              ip:
                type: string
                description: If an IP address is associated with the history event it will be included in this property.
              location:
                type: string
                description: If the history event include location information it will be included in this property. This is most likely to be returned for loss related events where it would indicate the loss location.
              logistics:
                type: object
                properties:
                  shipmentId:
                    type: string
                    description: The ID of the shipment.
                description: If the history event is related to shipment and contains logistical information it will be included in this property.
              possession:
                enum:
                  - Not Stated
                  - No
                  - Yes
                type: string
                description: 'For events with the `type` set to `check`, whether the checker was in possession of the device may be returned. This will be one of the following: `Not Stated`, `No` or `Yes`'
              reasonCode:
                enum:
                  - intelligence
                  - prisoner-property
                  - property-office
                  - found
                  - search-warrant
                  - stop-and-search
                  - training
                  - crime-report-precheck
                  - custody-suite
                  - forensic-examination
                  - county-lines-related
                  - further-investigation
                  - missing-person
                  - none
                type: string
                description: "Retuned for events with the `search` type. This is the reason for the search. The following values may be returned:\n\n|Search Reason Code|Description|\n|-|-|\n|county-lines-related|County Lines Related|\n|crime-report-precheck|Check Prior to Crime Reporting|\n|forensic-examination|Forensic Examination|\n|found|Found Property|\n|further-investigation|Further Investigation|\n|intelligence|Intelligence Gathering|\n|none|None|\n|prisoner-property|Prisoner Property|\n|property-office|Property Office|\n|search-warrant|Search Warrant|\n|stop-and-search|Stop and Search|\n|missing-person|Missing Persons|\n|training|Training, Demo or Analysis|\n"
              reasonText:
                type: string
                description: Retuned for events with the `search` type. This is the reason for the search for non-LEA systems that do not use `reasonCode` such as Claimscheck.
              reference:
                type: string
                description: A reference associated with the history event.
              relatedItems:
                type: array
                items:
                  type: object
                  properties:
                    category:
                      type: string
                      description: A category for the item.
                    dateFound:
                      type: string
                      description: If the item is part of a `loss` event but has since been found then this property will contain a date for when it was found.
                    description:
                      type: string
                      description: A description of the item.
                    identifiers:
                      type: array
                      items:
                        type: string
                      description: A list of identifiers associated with the item.
                    makeModel:
                      type: string
                      description: The make and model of the item.
                    reference:
                      type: string
                      description: A reference for the item.
                    value:
                      type: string
                      description: If a value for the item is supplied it will be included in this property.
                  additionalProperties: false
                description: A list of associated items. These may be items on the same asset register or items related to the same crime report.
              seller:
                type: object
                properties:
                  address:
                    type: string
                    description: The address of the seller.
                  identification:
                    type: array
                    items:
                      type: string
                      description: The identification type/number used by the seller.
                    description: A list of identifications for the seller. This may include things like a driving license number or passport number.
                  name:
                    type: string
                    description: The name of the seller.
                additionalProperties: false
                description: 'If the `type` of event is a transaction (such as a trade-in) and seller information is available, it will be included in this property.'
              system:
                type: string
                description: 'The name of the system that provided the event. E.g. The NMPR, Claimscheck, Recipero AssetWatch.'
              type:
                type: string
                description: "This is the type of history event. The possible values for this are not fixed, so your integration will need to be able to support any value.\n\nThe current list of types are as follows:\n\n|Type|Description|\n|-|-|\n|account|An online account (e.g. Immobilise) is associated with the number provided.|\n|activation|The device has been activated on a 3rd party network.|\n|asset|The device is protected by Recipero AssetWatch.|\n|block|A mobile network block exists for the device.|\n|unblock|A mobile network unblock exists for the device.|\n|check|A StatusCheck check was performed by a 3rd party via API or CheckMEND.|\n|claim|An insurance claim exists for the device.|\n|crime|A crime report exists for the device.|\n|found|A found report exists for the device.|\n|recovered|A report exists for the device indicating it has been recovered following loss/theft.|\n|inforeport|An information report exists for the device.|\n|notereport|An information note exists for the device.|\n|loss|A loss report exists for the device.|\n|search|A search was performed on the device.|\n|unregistered|The device is not registered to an owner.|\n|ownership|The device is registered to an owner.|\n|transaction|A transaction (e.g. trade-in) involving the device has taken place.|\n|mobile-network-status|Mobile network history for an MSISDN or IMEI.|\n"
              msisdnInfo:
                type: object
                properties:
                  msisdn:
                    type: string
                    description: The MSISDN associated with the history event.
                  onNetwork:
                    type: string
                    description: The current network for the MSISDN at the time of the history event.
                  originNetwork:
                    type: string
                    description: The original network for the MSISDN at the time of the history event.
                  isPorted:
                    type: boolean
                    description: If `true` then the MSISDN has been ported to a different network.
                  imei:
                    type: string
                    description: The IMEI associated with the MSISDN at the time of the history event if known.
                  lastSimChange:
                    type: string
                    description: The date of the last SIM change for the MSISDN if known at the time of the history event.
                  lastDeviceChange:
                    type: string
                    description: The date of the last device change for the MSISDN if known at the time of the history event.
              origin:
                enum:
                  - direct
                  - related
                type: string
                description: Indicates whether the event was created as a direct results of a searched idenfitier (`direct`) or if the event was created because it was associated with and returned in a search for another identifier (`related`). If the event is returned as a related event then the original identifier that created the event will be included in the `originIdentifier` property.
              originIdentifier:
                type: string
                description: If the event is returned as a related event then the original identifier that created the event will be included in this property.
              displayContext:
                enum:
                  - direct
                  - related
                type: string
                description: This indicates the context for the the event being returned in this search. If `direct` then the event directly related the searched identifier. If `related` then the event is being returned because it is related to the searched identifier and provides additional information that may be useful.
            additionalProperties: false
            description: The history of events relating to the searched identifier. This will be sorted by date in descending order by default but this can by changed in the original request. Only properties that include information will be returned. If a property is not returned for a given history event it is because that piece of information is not known.
      example:
        summary:
          asset: true
          blocked: true
          crime: true
          found: true
          information: true
          insurance: true
          lost: true
          searchHistory:
            - recipero-checkmend
            - recipero-intelligence
