    NMPR_Search_Request:
      required:
        - agentId
        - identifier
        - reasonCode
      type: object
      properties:
        agencyId:
          maxLength: 50
          minLength: 1
          type: string
          description: 'If perfoming the search on behalf on another agency, the ID of that agency can be supplied here. This property is not required if you are supplying an `agentId` that matches a registered account on The NMPR.'
        agentId:
          maxLength: 50
          minLength: 1
          type: string
          description: The ID or Email Address of the user/agent performing the search. If you are a single agency (e.g. a UK police force) performing checks on behalf of your agents then this field will be required and those officers must be registered on The NMPR with your agency.
        identifier:
          maxLength: 100
          minLength: 5
          type: string
          description: The identifier to search. E.g. serial number or IMEI.
        reasonCode:
          enum:
            - intelligence
            - prisoner-property
            - property-office
            - found
            - search-warrant
            - stop-and-search
            - training
            - crime-report-precheck
            - custody-suite
            - forensic-examination
            - county-lines-related
            - further-investigation
            - missing-person
          type: string
          description: "The reason for the search. The following values are accepted:\n\n|Search Reason Code|Description|\n|-|-|\n|county-lines-related|County Lines Related|\n|crime-report-precheck|Check Prior to Crime Reporting|\n|forensic-examination|Forensic Examination|\n|found|Found Property|\n|further-investigation|Further Investigation|\n|intelligence|Intelligence Gathering|\n|none|None|\n|prisoner-property|Prisoner Property|\n|property-office|Property Office|\n|search-warrant|Search Warrant|\n|stop-and-search|Stop and Search|\n|missing-person|Missing Persons|\n|training|Training, Demo or Analysis|\n"
        onBehalfOfAgentId:
          maxLength: 50
          minLength: 1
          type: string
          description: 'If your agent is perfoming the search on behalf on another agent, the ID of that agent can be supplied in this property.'
        reference:
          type: string
          description: A reference for the search. This would be either supplied by an agent or an internal ID for traceability purposes.
        sort:
          enum:
            - date-desc
            - date-asc
            - priority-desc
          type: string
          description: "The events list will contain a history of events that match the supplied identifier. This property affects the order of the events.\n\n|Sort Option|Description|\n|-|-|\n|date-asc|Sorted in ascending order by date.|\n|date-desc|Sorted in descending order by date. **Default**|\n|priority-desc|Sorted by priority and then by date in descending order.|\n\n*Priorty event grouping for priority-desc (network blocks > crime/loss > Recipero AssetWatch > others).*"
          default: date-desc
        subAgencyId:
          maxLength: 50
          minLength: 1
          type: string
          description: 'If perfoming the search on behalf on another sub-agency, the ID of that sub-agency can be supplied in this property. E.g. a police force borough.'
        updateMobileNetworkStatus:
          type: boolean
          description: 'If you are searching an MSISDN, setting this to true will attempt to update current/origin network information, sim/device swap and IMEI for that number. This feature requires the originating agency/user to have Number Intel permissions.'
          default: false
        includeRelatedEvents:
          type: boolean
          description: 'By default, the NMPR Search endpoint will return a list of events that directly match the searched identifier. Setting this to true will also return events that are related to the searched identifier. For example, if searching for an MSISDN and we have record of one or more IMEI relating to that MSISDN, the events relating to those IMEIs will also be returned. This can provide a more complete picture of the history of an identifier but may also return a larger number of events.'
          default: false
        metaData:
          type: object
          properties:
            covert:
              type: boolean
              description: "Some agents may have permission to perform searches that are either temporarily or permenantly hidden from other users due to investigation sensitivity (e.g. an internal investigation).\n\nThis property can only be used if supplying an `agentId` registered on The NMPR. **If the user or API client does not have this permission an error will be returned.**"
              default: false
            ip:
              type: string
              description: The IP address of the agent or agency performing the search.
      description: "The request schema for performing a search on Recipero's NMPR.\n\nThe `identifier` and `reasonCode` properties are always required. The `agencyId` and `agentId` properties are required by default but your account configuration may make these optional depending on use case."
      example:
        identifier: '100000010000023'
        agentId: Insert Personal Access Token
        reasonCode: intelligence
